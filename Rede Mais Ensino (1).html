  let A=[...(State.cache.aulas||[])];
  const perfil=State.user.perfil;const canEdit=['admin','coordenacao','professor'].includes(perfil);
  if(q){const s=q.toLowerCase();A=A.filter(a=>(a.titulo+a.moduloNome).toLowerCase().includes(s));}
  const fEsc=window.aulaEscFilter||'';if(fEsc)A=A.filter(a=>a.escolaId===fEsc);
  const total=A.length,pub=A.filter(a=>a.publicado).length;
  c.innerHTML=`
  <div class="aulas-hero"><div class="ah-ic">${icon('film')}</div>
    <div><h2>Biblioteca de aulas</h2><p>${total} aula(s) cadastrada(s) · ${pub} publicada(s). Organize por escola e módulo.</p></div></div>
  <div class="toolbar">
    <div class="search" style="flex:1"><span>${icon('search')}</span><input value="${esc(q||'')}" placeholder="Buscar aula..." oninput="renderAulasAdmin(this.value)"></div>
    <select onchange="setAulaEscFilter(this.value)"><option value="">Todas as escolas</option>${E.map(e=>`<option value="${e.id}" ${fEsc===e.id?'selected':''}>${esc(e.nome)}</option>`).join('')}</select>
    ${canEdit?`<button class="btn btn-green btn-sm" onclick="editAula()">${icon('plus')} Nova aula</button>`:''}
  </div>
  ${E.filter(e=>!fEsc||e.id===fEsc).map(e=>{const list=A.filter(a=>a.escolaId===e.id);if(!list.length)return '';
    return `<div class="panel" style="margin-bottom:20px"><div class="panel-h"><div style="display:flex;align-items:center;gap:12px"><div class="school-ic" style="width:42px;height:42px;margin:0">${icon(e.icon||'bookOpen')}</div><div><h3>${esc(e.nome)}</h3><p>${list.length} aula(s)</p></div></div></div>
    <div class="panel-b">${groupAulas(list).map(mod=>`<div class="modulo"><div class="modulo-h"><div class="mnum">${mod.num}</div><h3>${esc(mod.nome)}</h3><span class="mcount">${mod.aulas.length} aula(s)</span></div>
      <div class="aula-grid">${mod.aulas.map(a=>aulaCard(a,canEdit)).join('')}</div></div>`).join('')}</div></div>`;}).join('')||`<div class="empty" style="background:var(--elev);border-radius:var(--r-lg)">${icon('film')}<h4>Nenhuma aula ainda</h4><p>${canEdit?'Clique em "Nova aula" para adicionar a primeira vídeoaula.':'Aguarde a coordenação publicar as aulas.'}</p></div>`}`;
}
function aulaCard(a,canEdit){return `<div class="aula-card">
  <div class="aula-thumb" onclick="aulaPlayer('${a.id}')">
    <div class="play">${icon('play')}</div><span class="dur">${esc(a.duracao||'')}</span>
    ${a.publicado?'':'<span class="done-tag"><span class="chip warn"><span class="dot"></span>Rascunho</span></span>'}</div>
  <div class="aula-body"><b>${esc(a.titulo)}</b><p>${esc(a.descricao||'')}</p>
    <div class="aula-meta"><span>${icon('playCircle')} Aula ${a.ordem||1}</span>
    ${canEdit?`<span style="margin-left:auto;display:flex;gap:2px"><button class="icon-btn" style="width:28px;height:28px" onclick="event.stopPropagation();editAula('${a.id}')">${icon('edit')}</button><button class="icon-btn danger" style="width:28px;height:28px" onclick="event.stopPropagation();deleteAula('${a.id}')">${icon('trash')}</button></span>`:''}</div></div></div>`;}
function setAulaEscFilter(v){window.aulaEscFilter=v;renderAulasAdmin();}

function aulaPlayer(id){const a=(State.cache.aulas||[]).find(x=>x.id===id);if(!a)return;const E=State.cache.escolas||[];const e=E.find(x=>x.id===a.escolaId)||{};
  const url=a.videoUrl||'';const isFile=isVideoFile(url);
  const player=isFile?`<video controls src="${esc(url)}"></video>`:`<iframe src="${esc(embedUrl(url))}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
  const isAluno=State.user.perfil==='aluno';const watched=isAluno&&(State.cache.progresso||[]).some(p=>p.aulaId===id&&p.userId===State.user.id&&p.assistida);
  openModal(`<div class="modal-h"><div><h3>${esc(a.titulo)}</h3><p style="font-size:12px;color:var(--muted)">${esc(e.nome||'')} · ${esc(a.moduloNome||'')}</p></div><button class="x-btn" onclick="closeModal()">${icon('x')}</button></div>
  <div class="modal-b"><div class="player-wrap">${player}</div>
    <p style="font-size:14px;color:var(--tx-2);line-height:1.6">${esc(a.descricao||'')}</p>
    <div style="display:flex;align-items:center;gap:10px;margin-top:16px;font-size:12.5px;color:var(--muted)"><span>${icon('clock')} ${esc(a.duracao||'')}</span><span>${icon('playCircle')} Aula ${a.ordem||1}</span></div>
  </div>
  ${isAluno?`<div class="modal-f"><button class="btn ${watched?'btn-outline':'btn-green'}" onclick="markWatched('${id}')">${icon('checkCircle')} ${watched?'Assistida ✓':'Marcar como assistida'}</button></div>`:''}`,'xl');
  const mr=$('#modal-root .modal');if(mr)mr.classList.add('player-modal');
}
async function markWatched(id){const ex=(State.cache.progresso||[]).find(p=>p.aulaId===id&&p.userId===State.user.id);
  if(ex){await Store.update('progresso',ex.id,{assistida:!ex.assistida});}else{await Store.add('progresso',{aulaId:id,userId:State.user.id,assistida:true,data:new Date().toISOString()});}
  State.cache.progresso=[];await ensureCache(['progresso']);closeModal();toast('Progresso salvo','','ok');if(State.section==='minhas-aulas')renderMinhasAulas($('#content'));}

function editAula(id){const a=id?(State.cache.aulas||[]).find(x=>x.id===id):{publicado:true,modulo:1,ordem:1};const E=State.cache.escolas||[];
  openModal(`<div class="modal-h"><h3>${id?'Editar':'Nova'} aula</h3><button class="x-btn" onclick="closeModal()">${icon('x')}</button></div>
  <div class="modal-b"><div class="form-grid">
    <div class="field full"><label>Título da aula</label><input id="au_titulo" value="${esc(a.titulo||'')}" placeholder="Ex.: Quem é Jesus Cristo"></div>
    <div class="field"><label>Escola</label><select id="au_escola">${E.map(e=>`<option value="${e.id}" ${a.escolaId===e.id?'selected':''}>${esc(e.nome)}</option>`).join('')}</select></div>
    <div class="field"><label>Duração</label><input id="au_duracao" value="${esc(a.duracao||'')}" placeholder="Ex.: 32 min"></div>
    <div class="field"><label>Módulo (nº)</label><input id="au_modulo" type="number" value="${esc(a.modulo||1)}"></div>
    <div class="field"><label>Nome do módulo</label><input id="au_moduloNome" value="${esc(a.moduloNome||'')}" placeholder="Ex.: Fundamentos da Fé"></div>
    <div class="field"><label>Ordem</label><input id="au_ordem" type="number" value="${esc(a.ordem||1)}"></div>
    <div class="field"><label>Publicar?</label><select id="au_pub"><option value="1" ${a.publicado?'selected':''}>Sim, publicada</option><option value="0" ${!a.publicado?'selected':''}>Não, rascunho</option></select></div>
    <div class="field full"><label>Link do vídeo (YouTube, Vimeo ou .mp4)</label><input id="au_url" value="${esc(a.videoUrl||'')}" placeholder="https://youtube.com/watch?v=..."><span class="hint">Cole o link do YouTube/Vimeo ou o endereço de um arquivo de vídeo.</span></div>
    <div class="field full"><label>Descrição</label><textarea id="au_desc" placeholder="Sobre o que é a aula">${esc(a.descricao||'')}</textarea></div>
  </div></div>
  <div class="modal-f"><button class="btn btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-green" onclick="saveAula('${id||''}')">${icon('save')} Salvar aula</button></div>`,'lg');}
async function saveAula(id){const data={titulo:gv('au_titulo'),escolaId:gv('au_escola'),duracao:gv('au_duracao'),modulo:+gv('au_modulo')||1,moduloNome:gv('au_moduloNome')||('Módulo '+(gv('au_modulo')||1)),ordem:+gv('au_ordem')||1,publicado:gv('au_pub')==='1',videoUrl:gv('au_url'),descricao:gv('au_desc')};
  if(!data.titulo){toast('Informe o título','','warn');return;}if(!data.videoUrl){toast('Informe o link do vídeo','','warn');return;}
  if(id)await Store.update('aulas',id,data);else await Store.add('aulas',data);
  State.cache.aulas=[];await ensureCache(['aulas']);closeModal();renderAulasAdmin();toast('Aula salva','','ok');}
async function deleteAula(id){const a=(State.cache.aulas||[]).find(x=>x.id===id);confirmModal('Excluir aula',`Remover <b>${esc(a.titulo)}</b>?`,async()=>{await Store.remove('aulas',id);State.cache.aulas=[];await ensureCache(['aulas']);closeModal();renderAulasAdmin();toast('Aula excluída','','ok');});}

/* -------------------- 20. FINANCEIRO / FLUXO DE CAIXA -------------------- */
window.finFilter={q:'',tipo:'',status:'',page:1,per:10};
function renderFinanceiro(c){
  c=c||$('#content');const F=State.cache.financeiro||[];const E=State.cache.escolas||[];const now=new Date();
  const canEdit=['admin','financeiro'].includes(State.user.perfil);
  const mesEnt=F.filter(f=>f.tipo==='entrada'&&f.status==='pago'&&sameMonth(f.data,now));
  const recebido=mesEnt.reduce((s,f)=>s+f.valor,0);
  const previsto=F.filter(f=>f.tipo==='entrada'&&(f.status==='previsto'||f.status==='aberto')).reduce((s,f)=>s+f.valor,0);
  const atraso=F.filter(f=>f.tipo==='entrada'&&f.status==='atrasado').reduce((s,f)=>s+f.valor,0);
  const saidasMes=F.filter(f=>f.tipo==='saida'&&sameMonth(f.data,now)).reduce((s,f)=>s+f.valor,0);
  const saldo=recebido-saidasMes;
  // filtros lançamentos
  const f=window.finFilter;let list=[...F].sort((a,b)=>new Date(b.data)-new Date(a.data));
  if(f.q){const q=f.q.toLowerCase();list=list.filter(x=>(x.descricao+x.categoria).toLowerCase().includes(q));}
  if(f.tipo)list=list.filter(x=>x.tipo===f.tipo);if(f.status)list=list.filter(x=>x.status===f.status);
  const total=list.length,pages=Math.max(1,Math.ceil(total/f.per));if(f.page>pages)f.page=pages;const slice=list.slice((f.page-1)*f.per,f.page*f.per);
  c.innerHTML=`
  <div class="fin-kpis">
    <div class="kpi pos"><div class="kl">${icon('arrowDown')} Recebido no mês</div><div class="kv val-pos">${money(recebido)}</div><div class="ks">${mesEnt.length} lançamento(s) pago(s)</div></div>
    <div class="kpi info"><div class="kl">${icon('clock')} Previsto a receber</div><div class="kv">${money(previsto)}</div><div class="ks">Mensalidades e matrículas</div></div>
    <div class="kpi neg"><div class="kl">${icon('alert')} Em atraso</div><div class="kv val-neg">${money(atraso)}</div><div class="ks">Requer cobrança</div></div>
    <div class="kpi neutral"><div class="kl">${icon('wallet')} Saldo do mês</div><div class="kv ${saldo>=0?'val-pos':'val-neg'}">${money(saldo)}</div><div class="ks">Entradas − saídas</div></div>
  </div>
  <div class="charts-grid">
    <div class="panel"><div class="panel-h"><div><h3>Fluxo de caixa</h3><p>Entradas x saídas nos últimos 6 meses</p></div>
      <div class="flux-legend"><div class="fl"><span class="sw" style="background:var(--green)"></span>Entradas</div><div class="fl"><span class="sw" style="background:var(--bad)"></span>Saídas</div><div class="fl"><span class="sw" style="background:var(--gold)"></span>Saldo acum.</div></div></div>
      <div class="panel-b"><div class="chart-box"><canvas id="chFluxo"></canvas></div></div></div>
    <div class="panel"><div class="panel-h"><div><h3>Projeção</h3><p>Próximos meses (previsto)</p></div></div>
      <div class="panel-b"><div class="chart-box sm"><canvas id="chProj"></canvas></div></div></div>
  </div>
  <div class="panel"><div class="panel-h"><div><h3>Lançamentos</h3><p>${total} registro(s)</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <select onchange="finSet('tipo',this.value)"><option value="">Todos</option><option value="entrada" ${f.tipo==='entrada'?'selected':''}>Entradas</option><option value="saida" ${f.tipo==='saida'?'selected':''}>Saídas</option></select>
      <select onchange="finSet('status',this.value)"><option value="">Situação</option>${Object.entries({pago:'Pago',previsto:'Previsto',aberto:'Em aberto',atrasado:'Atrasado'}).map(([k,v])=>`<option value="${k}" ${f.status===k?'selected':''}>${v}</option>`).join('')}</select>
      <button class="btn btn-outline btn-sm" onclick="exportFinanceiroCSV()">${icon('download')} CSV</button>
      ${canEdit?`<button class="btn btn-green btn-sm" onclick="editLancamento()">${icon('plus')} Lançamento</button>`:''}</div></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Descrição</th><th>Categoria</th><th>Data</th><th>Situação</th><th style="text-align:right">Valor</th>${canEdit?'<th></th>':''}</tr></thead>
    <tbody>${slice.length?slice.map(x=>`<tr>
      <td><div style="display:flex;align-items:center;gap:10px"><div class="icon-btn" style="background:${x.tipo==='entrada'?'var(--ok-bg)':'var(--bad-bg)'};color:${x.tipo==='entrada'?'var(--ok)':'var(--bad)'};cursor:default">${icon(x.tipo==='entrada'?'arrowDown':'arrowUp')}</div><b style="font-size:13.5px">${esc(x.descricao)}</b></div></td>
      <td><span class="chip muted">${esc(x.categoria)}</span></td><td style="font-size:12.5px;color:var(--muted)">${fmtDate(x.data)}</td><td>${statusChip(x.status)}</td>
      <td style="text-align:right" class="${x.tipo==='entrada'?'val-pos':'val-neg'} mono">${x.tipo==='entrada'?'+':'−'} ${money(x.valor)}</td>
      ${canEdit?`<td style="text-align:right"><div class="row-actions" style="justify-content:flex-end"><button class="icon-btn" onclick="editLancamento('${x.id}')">${icon('edit')}</button><button class="icon-btn danger" onclick="deleteLancamento('${x.id}')">${icon('trash')}</button></div></td>`:''}</tr>`).join(''):`<tr><td colspan="${canEdit?6:5}"><div class="empty">${icon('wallet')}<h4>Sem lançamentos</h4></div></td></tr>`}</tbody></table></div>
    <div class="pager" style="padding:16px 20px"><span>página ${f.page} de ${pages}</span>
      <div class="pg-btns"><button class="pg-btn" ${f.page<=1?'disabled':''} onclick="finSet('page',${f.page-1})">${icon('chevL')}</button>
      ${Array.from({length:pages},(_,i)=>i+1).slice(Math.max(0,f.page-3),f.page+2).map(p=>`<button class="pg-btn ${p===f.page?'on':''}" onclick="finSet('page',${p})">${p}</button>`).join('')}
      <button class="pg-btn" ${f.page>=pages?'disabled':''} onclick="finSet('page',${f.page+1})">${icon('chevR')}</button></div></div>
  </div>`;
  setTimeout(drawFinCharts,30);
}
function sameMonth(d,ref){const x=new Date(d);return x.getMonth()===ref.getMonth()&&x.getFullYear()===ref.getFullYear();}
function finSet(k,v){window.finFilter[k]=v;if(k!=='page')window.finFilter.page=1;renderFinanceiro();}
function drawFinCharts(){
  ['fluxo','proj'].forEach(k=>{if(State.charts[k]){try{State.charts[k].destroy();}catch(e){}}});
  if(!window.Chart)return;const c=chartColors();const F=State.cache.financeiro||[];
  const lm=[],ent=[],sai=[],acum=[];let run=0;
  for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i);lm.push(monthLabel(d));
    const e=F.filter(f=>f.tipo==='entrada'&&f.status==='pago'&&sameMonth(f.data,d)).reduce((s,f)=>s+f.valor,0);
    const s=F.filter(f=>f.tipo==='saida'&&sameMonth(f.data,d)).reduce((s,f)=>s+f.valor,0);
    ent.push(e);sai.push(s);run+=e-s;acum.push(run);}
  const el=$('#chFluxo');if(el)State.charts.fluxo=new Chart(el,{data:{labels:lm,datasets:[
    {type:'bar',label:'Entradas',data:ent,backgroundColor:c.green,borderRadius:6,maxBarThickness:18,order:2},
    {type:'bar',label:'Saídas',data:sai,backgroundColor:c.bad,borderRadius:6,maxBarThickness:18,order:2},
    {type:'line',label:'Saldo acum.',data:acum,borderColor:c.gold,backgroundColor:'transparent',borderWidth:2.5,tension:.4,pointRadius:3,pointBackgroundColor:c.gold,order:1}
  ]},options:{...baseOpts(),plugins:{...baseOpts().plugins,legend:{display:false},tooltip:{...baseOpts().plugins.tooltip,callbacks:{label:(ctx)=>ctx.dataset.label+': '+money(ctx.raw)}}}}});
  // projeção: próximos 4 meses de mensalidades previstas
  const pm=[],pv=[];const mens=F.filter(f=>f.categoria==='Mensalidade').length;const baseMens=F.filter(f=>f.categoria==='Mensalidade').reduce((s,f)=>s+f.valor,0)/(Math.max(1,new Set(F.filter(f=>f.categoria==='Mensalidade').map(f=>monthLabel(f.data))).size));
  for(let i=1;i<=4;i++){const d=new Date();d.setMonth(d.getMonth()+i);pm.push(monthLabel(d));pv.push(Math.round(baseMens||0));}
  const el2=$('#chProj');if(el2)State.charts.proj=new Chart(el2,{type:'bar',data:{labels:pm,datasets:[{data:pv,backgroundColor:c.info,borderRadius:8,maxBarThickness:36}]},options:{...baseOpts(),plugins:{...baseOpts().plugins,tooltip:{...baseOpts().plugins.tooltip,callbacks:{label:(ctx)=>money(ctx.raw)}}}}});
}
function editLancamento(id){const x=id?(State.cache.financeiro||[]).find(f=>f.id===id):{tipo:'entrada',status:'pago',data:new Date().toISOString().slice(0,10)};
  openModal(`<div class="modal-h"><h3>${id?'Editar':'Novo'} lançamento</h3><button class="x-btn" onclick="closeModal()">${icon('x')}</button></div>
  <div class="modal-b"><div class="form-grid">
    <div class="field"><label>Tipo</label><select id="fl_tipo"><option value="entrada" ${x.tipo==='entrada'?'selected':''}>Entrada</option><option value="saida" ${x.tipo==='saida'?'selected':''}>Saída</option></select></div>
    <div class="field"><label>Valor (R$)</label><input id="fl_valor" type="number" step="0.01" value="${esc(x.valor||'')}"></div>
    <div class="field full"><label>Descrição</label><input id="fl_desc" value="${esc(x.descricao||'')}" placeholder="Ex.: Mensalidade · João"></div>
    <div class="field"><label>Categoria</label><input id="fl_cat" value="${esc(x.categoria||'')}" placeholder="Ex.: Mensalidade"></div>
    <div class="field"><label>Data</label><input id="fl_data" type="date" value="${esc((x.data||'').slice(0,10))}"></div>
    <div class="field"><label>Situação</label><select id="fl_status">${Object.entries({pago:'Pago',previsto:'Previsto',aberto:'Em aberto',atrasado:'Atrasado'}).map(([k,v])=>`<option value="${k}" ${x.status===k?'selected':''}>${v}</option>`).join('')}</select></div>
    <div class="field"><label>Método</label><input id="fl_metodo" value="${esc(x.metodo||'')}" placeholder="Pix, Cartão..."></div>
  </div></div>
  <div class="modal-f"><button class="btn btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-green" onclick="saveLancamento('${id||''}')">${icon('save')} Salvar</button></div>`);}
async function saveLancamento(id){const data={tipo:gv('fl_tipo'),valor:+gv('fl_valor')||0,descricao:gv('fl_desc'),categoria:gv('fl_cat')||'Outros',data:new Date(gv('fl_data')||Date.now()).toISOString(),status:gv('fl_status'),metodo:gv('fl_metodo')};
  if(!data.descricao||!data.valor){toast('Informe descrição e valor','','warn');return;}
  if(id)await Store.update('financeiro',id,data);else await Store.add('financeiro',data);
  State.cache.financeiro=[];await ensureCache(['financeiro']);closeModal();renderFinanceiro();toast('Lançamento salvo','','ok');}
async function deleteLancamento(id){confirmModal('Excluir lançamento','Remover este lançamento?',async()=>{await Store.remove('financeiro',id);State.cache.financeiro=[];await ensureCache(['financeiro']);closeModal();renderFinanceiro();toast('Lançamento excluído','','ok');});}
function exportFinanceiroCSV(){const rows=[['Tipo','Descrição','Categoria','Data','Situação','Método','Valor']];
  (State.cache.financeiro||[]).forEach(x=>rows.push([x.tipo,x.descricao,x.categoria,fmtDate(x.data),(STATUS[x.status]||['',x.status])[1],x.metodo||'',String(x.valor).replace('.',',')]));
  const csv='\ufeff'+rows.map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fluxo_caixa_rede_mais_ensino.csv';a.click();toast('CSV exportado','','ok');}

/* -------------------- 21. ÁREA DO ALUNO -------------------- */
function myMatricula(){const u=State.user;const M=State.cache.matriculas||[];
  return M.find(m=>m.id===u.matriculaId)||M.find(m=>(m.email||'').toLowerCase()===(u.email||'').toLowerCase())||null;}
function renderMinhaMatricula(c){
  const m=myMatricula();const E=State.cache.escolas||[];
  if(!m){c.innerHTML=`<div class="empty" style="background:var(--elev);border-radius:var(--r-lg);padding:70px 24px">${icon('clipboard')}<h4>Nenhuma matrícula encontrada</h4><p>Não localizamos uma matrícula vinculada ao seu acesso. Fale com a secretaria.</p><a href="#/matricula" class="btn btn-green" style="margin-top:16px">${icon('plus')} Fazer matrícula</a></div>`;return;}
  const e=E.find(x=>x.id===m.escolaId)||{};
  const stMsg={pendente:['warn','Sua matrícula está em análise pela secretaria. Você será avisado por e-mail.'],em_analise:['info','Estamos analisando seus documentos. Em breve teremos novidades.'],aprovada:['green','Parabéns! Sua matrícula está aprovada. Bons estudos!'],rejeitada:['bad',m.obs||'Sua matrícula precisa de ajustes. Fale com a secretaria.']}[m.status]||['muted',''];
  const row=(k,v)=>`<div class="di"><span class="dl">${k}</span><span class="dv">${esc(v||'—')}</span></div>`;
  c.innerHTML=`
  <div class="panel" style="margin-bottom:20px;border-left:3px solid var(--${stMsg[0]==='green'?'ok':stMsg[0]==='warn'?'warn':stMsg[0]==='bad'?'bad':'info'})">
    <div class="panel-b" style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
      <div class="stat" style="padding:0;border:none;background:none"><div class="ic i-${stMsg[0]==='green'?'green':stMsg[0]==='warn'?'amber':stMsg[0]==='bad'?'red':'blue'}" style="margin:0">${icon(m.status==='aprovada'?'checkCircle':m.status==='rejeitada'?'alert':'clock')}</div></div>
      <div style="flex:1;min-width:200px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:4px"><h3 style="font-size:18px">Matrícula ${statusChip(m.status)}</h3></div><p style="font-size:14px;color:var(--tx-2)">${esc(stMsg[1])}</p></div>
      ${m.status==='aprovada'?`<button class="btn btn-green" onclick="goSection('minhas-aulas')">${icon('play')} Ir para as aulas</button>`:''}
    </div></div>
  <div class="panel"><div class="panel-h"><div><h3>Dados da matrícula</h3><p class="mono">${esc(m.numero)}</p></div>
    <div class="row-actions"><button class="btn btn-outline btn-sm" onclick="printFicha('${m.id}')">${icon('printer')} Ficha</button>${m.status==='aprovada'?`<button class="btn btn-outline btn-sm" onclick="printDeclaracao('${m.id}')">${icon('award')} Declaração</button>`:''}</div></div>
    <div class="panel-b">
      <div class="sec-title">Formação</div><div class="detail-grid">${row('Escola',e.nome)}${row('Encontros',(m.dia||'')+' · '+(m.turno||''))}${row('Coordenação',e.coordenador)}${row('Carga horária',e.cargaHoraria)}</div>
      <div class="sec-title">Meus dados</div><div class="detail-grid">${row('Nome',m.nome)}${row('CPF',m.cpf)}${row('E-mail',m.email)}${row('Celular',m.celular)}</div>
      <div class="sec-title">Documentos</div><div class="doc-list">${(m.docs||[]).map(x=>`<div class="doc-item"><span class="di">${icon('fileText')}</span><div class="dn"><b>${esc(x.nome)}</b></div>${statusChip(x.status)}</div>`).join('')||'<p style="color:var(--muted)">Sem documentos.</p>'}</div>
    </div></div>`;
}
function renderMinhasAulas(c){
  c=c||$('#content');const m=myMatricula();const E=State.cache.escolas||[];
  if(!m||m.status!=='aprovada'){c.innerHTML=`<div class="empty" style="background:var(--elev);border-radius:var(--r-lg);padding:70px 24px">${icon('play')}<h4>Aulas ainda indisponíveis</h4><p>${m?'Suas aulas serão liberadas assim que sua matrícula for aprovada.':'Nenhuma matrícula vinculada ao seu acesso.'}</p></div>`;return;}
  const e=E.find(x=>x.id===m.escolaId)||{};
  const aulas=(State.cache.aulas||[]).filter(a=>a.escolaId===m.escolaId&&a.publicado);
  const prog=(State.cache.progresso||[]).filter(p=>p.userId===State.user.id&&p.assistida);
  const watchedIds=new Set(prog.map(p=>p.aulaId));
  const totalA=aulas.length,doneA=aulas.filter(a=>watchedIds.has(a.id)).length;
  const pct=totalA?Math.round(doneA/totalA*100):0;
  c.innerHTML=`
  <div class="aulas-hero"><div class="ah-ic">${icon(e.icon||'bookOpen')}</div>
    <div><h2>${esc(e.nome)}</h2><p>${totalA} aula(s) disponíveis · continue de onde parou</p></div>
    <div class="ah-prog"><div class="pv">${pct}%</div><span style="font-size:12px;color:var(--muted)">${doneA} de ${totalA} concluídas</span><div class="bar"><div class="fill" style="width:${pct}%"></div></div></div></div>
  ${totalA?groupAulas(aulas).map(mod=>{const md=mod.aulas.filter(a=>watchedIds.has(a.id)).length;return `<div class="modulo"><div class="modulo-h"><div class="mnum">${mod.num}</div><h3>${esc(mod.nome)}</h3><span class="mcount">${md}/${mod.aulas.length} concluídas</span></div>
    <div class="aula-grid">${mod.aulas.map(a=>`<div class="aula-card"><div class="aula-thumb" onclick="aulaPlayer('${a.id}')"><div class="play">${icon('play')}</div><span class="dur">${esc(a.duracao||'')}</span>${watchedIds.has(a.id)?`<span class="done-tag"><span class="chip green"><span class="dot"></span>Assistida</span></span>`:''}</div>
      <div class="aula-body"><b>${esc(a.titulo)}</b><p>${esc(a.descricao||'')}</p><div class="aula-meta"><span>${icon('playCircle')} Aula ${a.ordem||1}</span>${watchedIds.has(a.id)?`<span style="margin-left:auto;color:var(--ok)">${icon('checkCircle')}</span>`:''}</div></div></div>`).join('')}</div></div>`;}).join(''):`<div class="empty" style="background:var(--elev);border-radius:var(--r-lg)">${icon('film')}<h4>Nenhuma aula publicada ainda</h4><p>A coordenação está preparando o conteúdo. Volte em breve!</p></div>`}`;
}

/* -------------------- 22. PERFIL -------------------- */
function renderPerfil(c){const u=State.user;
  c.innerHTML=`<div class="content-narrow" style="margin:0 auto">
  <div class="panel" style="margin-bottom:20px"><div class="panel-b" style="display:flex;align-items:center;gap:18px">
    <div class="coord-av" style="width:72px;height:72px;font-size:26px;margin:0">${initials(u.nome)}</div>
    <div><h3 style="font-size:20px">${esc(u.nome)}</h3><span class="chip ${(PERFIS[u.perfil]||{}).color||'muted'}" style="margin-top:6px"><span class="dot"></span>${(PERFIS[u.perfil]||{}).label||u.perfil}</span></div></div></div>
  <div class="panel" style="margin-bottom:20px"><div class="panel-h"><div><h3>Meus dados</h3><p>Atualize suas informações</p></div></div>
    <div class="panel-b"><div class="form-grid">
      <div class="field full"><label>Nome</label><input id="pr_nome" value="${esc(u.nome)}"></div>
      <div class="field full"><label>E-mail</label><input id="pr_email" value="${esc(u.email)}"></div>
    </div><button class="btn btn-green" style="margin-top:16px" onclick="savePerfil()">${icon('save')} Salvar dados</button></div></div>
  <div class="panel"><div class="panel-h"><div><h3>Alterar senha</h3><p>Escolha uma senha segura</p></div></div>
    <div class="panel-b"><div class="form-grid">
      <div class="field"><label>Nova senha</label><input id="pr_senha" type="password" placeholder="••••••••"></div>
      <div class="field"><label>Confirmar senha</label><input id="pr_senha2" type="password" placeholder="••••••••"></div>
    </div><button class="btn btn-outline" style="margin-top:16px" onclick="savePassword()">${icon('key')} Alterar senha</button></div></div>
  </div>`;}
async function savePerfil(){const nome=gv('pr_nome'),email=gv('pr_email');if(!nome||!validEmail(email)){toast('Preencha nome e e-mail válidos','','warn');return;}
  await Store.update('usuarios',State.user.id,{nome,email});State.user.nome=nome;State.user.email=email;saveSession(State.user);State.cache.usuarios=[];
  toast('Dados atualizados','','ok');renderApp($('#app-root'),'perfil');}
async function savePassword(){const s=$('#pr_senha').value,s2=$('#pr_senha2').value;if(s.length<4){toast('Senha muito curta','Use ao menos 4 caracteres.','warn');return;}if(s!==s2){toast('As senhas não conferem','','warn');return;}
  await Store.update('usuarios',State.user.id,{senha:s});toast('Senha alterada','','ok');$('#pr_senha').value='';$('#pr_senha2').value='';}

/* -------------------- 23. BOOT -------------------- */
function boot(){
  initTheme();
  if(FIREBASE_READY){FirebaseBackend.init().then(()=>{Store.backend=FirebaseBackend;}).catch(e=>{console.warn('Firebase falhou, usando modo demo',e);Store.backend=LocalBackend;});}
  const sess=loadSession();if(sess)State.user=sess;
  window.addEventListener('hashchange',router);
  window.addEventListener('resize',debounce(()=>{if(window.innerWidth>1024&&State.mobileOpen){State.mobileOpen=false;const sb=$('#sidebar');if(sb)sb.classList.remove('mobile-open');const bd=$('.mobile-backdrop');if(bd)bd.classList.remove('show');}},150));
  router();
}
Object.assign(window,{toggleTheme,navigate,closeModal,toggleNavMenu,sendContact,fillLogin,doLogin,recoverPass,doRecover,logout,
  wizNext,wizBack,pickEscola,pickRadio,toggleRespMesmo,buscarCEP,handleUpload,toggleAceite,clearSign,printProtocolo,
  goSection,toggleSidebar,toggleMobile,onGlobalSearch,secSet,finSet,
  viewMatricula,editMatricula,saveMatricula,setMatriculaStatus,confirmReject,deleteMatricula,exportMatriculasCSV,printFicha,printDeclaracao,
  editEscola,saveEscola,deleteEscola,editProf,saveProf,deleteProf,editUser,saveUser,deleteUser,
  backupJSON,restoreJSON,resetDemo,editAula,saveAula,deleteAula,aulaPlayer,markWatched,setAulaEscFilter,renderAulasAdmin,
  editLancamento,saveLancamento,deleteLancamento,exportFinanceiroCSV,savePerfil,savePassword,
  maskCPF,maskPhone,maskCEP});
boot();

</script>
